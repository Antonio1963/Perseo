one più bassi dove si sta oltre 4 ore al giorno).\n\nBuone pratiche: antenne **alte e lontane** dalle persone, attenzione alle direttive in VHF/UHF e alle microonde, non toccare le antenne in trasmissione (ustioni da RF), portatili lontani dagli occhi.\n\n### A17.5 Compatibilità elettromagnetica (EMC) e interferenze\n\n- **Emissioni indesiderate del trasmettitore:** armoniche e spurie (si eliminano con filtri **passa-basso** all'uscita), splatter da sovramodulazione, click in CW.\n- **Interferenze subite dagli apparecchi vicini:** l'impianto TV, l'hi-fi o il citofono captano un segnale forte e lo rivelano (**sovraccarico**), anche se il trasmettitore è pulito. Rimedi: filtri passa-alto sull'ingresso TV, ferriti (anelli toroidali) sui cavi, buona messa a terra.\n- **Disturbi ricevuti:** alimentatori switching, LED, inverter fotovoltaici, Wi-Fi via rete elettrica (PLC) alzano il rumore di fondo in HF.\n- Primo passo: verificare se il disturbo c'è anche con il trasmettitore su carico fittizio, e tenere un registro di quando si trasmette.\n\n> **Da ricordare.** 30 mA = soglia del differenziale; scaricare i condensatori prima di toccare; antenne lontane dalle linee elettriche; con il temporale staccare le antenne; passa-basso contro le armoniche, ferriti e passa-alto contro i sovraccarichi.\n\n# Parte B – Regole e procedure operative\n\n## B1. Alfabeto fonetico e numeri\n\n### B1.1 Perché serve\n\nIn fonia molte lettere si confondono (B, D, E, P, T, V…), soprattutto con disturbi e accenti diversi. L'**alfabeto fonetico internazionale** (ICAO/NATO, adottato dall'UIT) associa a ogni lettera una parola scelta per essere comprensibile in tutte le lingue. In radio il nominativo si **scandisce sempre** con l'alfabeto fonetico.\n\n### B1.2 La tabella\n\n| Lettera | Parola | Lettera | Parola | Lettera | Parola |\n| --- | --- | --- | --- | --- | --- |\n| A | Alfa | J | Juliett | S | Sierra |\n| B | Bravo | K | Kilo | T | Tango |\n| C | Charlie | L | Lima | U | Uniform |\n| D | Delta | M | Mike | V | Victor |\n| E | Echo | N | November | W | Whiskey |\n| F | Foxtrot | O | Oscar | X | X-ray |\n| G | Golf | P | Papa | Y | Yankee |\n| H | Hotel | Q | Quebec | Z | Zulu |\n| I | India | R | Romeo |  |  |\n\nScritture ufficiali da notare: **Alfa** (non Alpha) e **Juliett** (con due t), scelte perché si pronuncino bene anche da chi non parla inglese.\n\n### B1.3 I numeri\n\nNei collegamenti internazionali i numeri si pronunciano secondo l'Annesso 10 ICAO: ZE-RO, WUN, TOO, TREE, FOW-er, FIFE, SIX, SEV-en, AIT, NIN-er; la virgola è **DAY-SEE-MAL** («decimal»). Tra italiani si usano i numeri in italiano.\n\n**Esempi svolti.**\n\n- IT9ABC → «India Tango Nove Alfa Bravo Charlie» (in inglese: «India Tango Niner Alfa Bravo Charlie»).\n- Frequenza 145,500 MHz → «One Four Five decimal Five».\n- Locatore JM77 → «Juliett Mike Seven Seven».\n\n### B1.4 Le alternative non ufficiali\n\nNelle chiamate DX capita di sentire parole diverse («Italy», «Japan», «Kilowatt»…) usate per farsi capire meglio in condizioni difficili. Sono abitudini operative tollerate, non standard: all'esame vale sempre l'alfabeto ICAO.\n\n> **Da ricordare.** Si scandisce sempre il nominativo; Alfa e Juliett si scrivono così; «decimal» per la virgola nelle frequenze.\n\n## B2. Codice Q, abbreviazioni e codice RST\n\n### B2.1 Come funziona il codice Q\n\nIl codice Q è un insieme di gruppi di tre lettere che iniziano con Q, nato per la telegrafia marittima e oggi usato da tutti i servizi. Ogni gruppo ha due forme: **seguito da un punto interrogativo è una domanda**, da solo è un'affermazione o una risposta.\n\n- Serie **QAA–QNZ**: servizio aeronautico.\n- Serie **QOA–QQZ**: servizio marittimo.\n- Serie **QRA–QUZ**: tutti i servizi, radioamatori compresi.\n\nGli orari si danno sempre in **UTC**.\n\n### B2.2 I codici Q da sapere\n\n| Codice | Come domanda (con ?) | Come affermazione |\n| --- | --- | --- |\n| **QRA** | Come si chiama la vostra stazione? | La mia stazione si chiama… (nell'uso: il nome dell'operatore) |\n| **QRB** | A che distanza siete? | La distanza è di circa… km |\n| **QRG** | Qual è la mia frequenza esatta? | La vostra frequenza esatta è… |\n| **QRK** | Com'è la comprensibilità dei miei segnali? | Comprensibilità… (scala 1–5) |\n| **QRL** | Siete occupato? | Sono occupato (non interferite) |\n| **QRM** | Siete disturbato da altre stazioni? | Sono disturbato (interferenza) |\n| **QRN** | Siete disturbato da rumori atmosferici? | Disturbi atmosferici (temporali) |\n| **QRO** | Devo aumentare la potenza? | Aumentate la potenza |\n| **QRP** | Devo diminuire la potenza? | Diminuite la potenza (e: stazione a bassa potenza, ≤ 5 W) |\n| **QRQ** | Devo trasmettere più in fretta? | Trasmettete più in fretta |\n| **QRS** | Devo trasmettere più adagio? | Trasmettete più adagio |\n| **QRT** | Devo cessare di trasmettere? | Cessate di trasmettere (chiudo la stazione) |\n| **QRV** | Siete pronto? | Sono pronto |\n| **QRX** | Quando mi richiamerete? | Vi richiamerò alle… (attendete) |\n| **QRZ** | Chi mi chiama? | Siete chiamato da… |\n| **QSA** | Qual è la forza dei miei segnali? | Forza… (scala 1–5 o 1–9) |\n| **QSB** | La forza dei miei segnali varia? | La forza varia (evanescenza) |\n| **QSL** | Potete dare ricevuta? | Do ricevuta (e: cartolina di conferma) |\n| **QSO** | Potete comunicare con…? | Posso comunicare con… (e: il collegamento) |\n| **QSY** | Devo cambiare frequenza? | Passate su… kHz |\n| **QTC** | Quanti messaggi avete? | Ho… messaggi |\n| **QTH** | Qual è la vostra posizione? | La mia posizione è… |\n| **QTR** | Qual è l'ora esatta? | L'ora esatta è… UTC |\n\n**Trucchi per ricordarli.** QR**L** = **L**avoro (occupato); QR**N** = rumore **N**aturale; QR**M** = disturbo «**M**ano umana»; QR**O** = p**O**tenza su (*overpower*); QR**P** = **P**iccola potenza; QR**Q** = *Quick*; QR**S** = *Slow*.\n\n**Errori classici.** **QRK** è la *comprensibilità*, non la forza (la forza è **QSA**). **QRZ?** chiede chi ci chiama, non il nome dell'operatore.\n\n### B2.3 Abbreviazioni operative\n\n| Sigla | Significato | Sigla | Significato |\n| --- | --- | --- | --- |\n| **CQ** | Chiamata generale a tutte le stazioni | **DE** | «Da», separa i nominativi (IT9ABC DE IK2XYZ) |\n| **K** | Invito a trasmettere (passo) | **KN** | Passo solo alla stazione chiamata |\n| **AR** | Fine della trasmissione | **SK** / **VA** | Fine del collegamento |\n| **AS** | Attendete | **BK** | Interruzione (break) |\n| **R** | Ricevuto | **PSE** | Per favore |\n| **TNX / TKS** | Grazie | **UR** | Vostro |\n| **RST** | Rapporto di leggibilità, forza, tono | **MSG** | Messaggio |\n| **73** | Cordiali saluti | **88** | Baci e abbracci (affettuoso) |\n| **DX** | Stazione lontana | **OM / YL / XYL** | Radioamatore / signorina / moglie |\n| **RX / TX** | Ricevitore / trasmettitore | **WX** | Condizioni meteo |\n| **HI** | Risata (in CW) | **SIG** | Segnale |\n\n«73» si scrive sempre al singolare: «73s» è un errore comune.\n\n### B2.4 Il codice RST\n\n| Lettera | Che cosa misura | Scala | Estremi |\n| --- | --- | --- | --- |\n| **R** – *Readability* | Leggibilità | 1–5 | 1 illeggibile · 5 perfettamente leggibile |\n| **S** – *Strength* | Forza del segnale | 1–9 | 1 appena percettibile · 9 molto forte |\n| **T** – *Tone* | Qualità della nota | 1–9 | 1 nota ronzante · 9 nota pura (solo CW e digitali) |\n\n- In **fonia** il rapporto ha **due cifre** (es. **59**), in **CW tre** (es. **599**).\n- Sopra S9 si aggiungono i dB: «59 + 20 dB».\n- Sullo S-meter in HF **S9 = 50 µV** su 50 Ω; ogni punto S vale circa **6 dB**.\n- Nei contest CW si scrive **5NN** (N al posto del 9 è più veloce da battere).\n\n**Esempio svolto.** Un corrispondente ti passa «57» in SSB: lo comprendi perfettamente (5) con un segnale abbastanza forte (7). Se in CW senti «479»: leggibile quasi completamente, segnale buono, nota perfetta.\n\n> **Da ricordare.** Con il ? è una domanda; QRK = comprensibilità, QSA = forza; RST in fonia 2 cifre, in CW 3; S9 = 50 µV in HF; 73 al singolare.\n\n## B3. Il QSO passo per passo\n\n### B3.1 Prima di trasmettere\n\n1. **Ascoltare** a lungo la frequenza: è libera? È dentro la banda e nel segmento giusto del band plan per il modo che uso?\n2. **Chiedere se è libera:** in fonia «La frequenza è libera?», in CW **QRL?**. Se qualcuno risponde, ci si sposta.\n3. Controllare che tutta l'emissione resti nella banda (in LSB il segnale si estende sotto la frequenza indicata).\n4. Usare la **minima potenza** necessaria.\n\n### B3.2 Le cinque fasi di un collegamento\n\n| Fase | Cosa si dice (fonia) | In CW |\n| --- | --- | --- |\n| 1. Chiamata | «CQ CQ CQ, qui IT9ABC, India Tango Nove Alfa Bravo Charlie…, in ascolto» | CQ CQ CQ DE IT9ABC IT9ABC K |\n| 2. Risposta | «IT9ABC da IK2XYZ, India Kilo Due X-ray Yankee Zulu, passo» | IT9ABC DE IK2XYZ K |\n| 3. Rapporto | «Ti ricevo 59, il mio nome è Antonio, QTH Catania, passo» | UR RST 599 NAME TONY QTH CATANIA |\n| 4. Corpo | Apparati, antenne, meteo, conferma QSL | RIG, ANT, WX… |\n| 5. Chiusura | «Grazie del QSO, 73, IK2XYZ da IT9ABC, chiudo» | TNX QSO 73 IK2XYZ DE IT9ABC SK |\n\n**Varianti della chiamata.** **CQ DX** cerca solo stazioni lontane (gli europei non rispondono); **CQ** seguito da un'area («CQ Giappone») cerca una zona precisa; **CQ contest** o «CQ test» durante le gare. Su un ponte ripetitore non si chiama CQ in modo lungo: basta «IT9ABC in ascolto».\n\n### B3.3 Identificazione\n\nIl proprio nominativo si trasmette **all'inizio e alla fine** del collegamento e **almeno ogni 10 minuti** durante i collegamenti lunghi (art. 12 dell'Allegato 26); nei modi a pacchetto è contenuto in ogni pacchetto. Le trasmissioni senza identificazione sono vietate.\n\n### B3.4 Pile-up e split\n\nQuando una stazione rara (DX o spedizione) chiama, decine di stazioni rispondono insieme (**pile-up**).\n\n- Si risponde con il **nominativo completo, una volta**, poi si ascolta. Non si ripete senza sosta.\n- Se la stazione rara dice **«up 5»** o **«split»**, trasmette su una frequenza e ascolta 5 kHz più in alto: bisogna impostare il ricetrasmettitore in **split** (VFO A per ricevere, VFO B per trasmettere) e **non trasmettere mai sulla sua frequenza**.\n- Chi chiama numeri («solo le 9», «solo Giappone») va rispettato.\n\n### B3.5 Sui ponti ripetitori\n\n- Il ponte riceve su una frequenza (ingresso) e ritrasmette su un'altra (uscita): in 2 m l'ingresso è **600 kHz più in basso**, in 70 cm **1,6 MHz più in alto** (circolare ministeriale del 2022).\n- Molti ponti si aprono con un **tono subaudio CTCSS**.\n- Lasciare **una pausa** tra un passaggio e l'altro: qualcuno potrebbe avere un'emergenza o voler entrare.\n- Passaggi brevi: il ponte è di tutti.\n\n### B3.6 Il registro di stazione e la QSL\n\nOgni QSO si annota nel **registro di stazione** (log), obbligatorio, cartaceo o elettronico: data, ora **UTC** di inizio e fine, frequenza, modo, potenza, nominativo del corrispondente, rapporti dati e ricevuti, osservazioni, QSL. La **cartolina QSL** (cartacea, via bureau dell'associazione o diretta) o la conferma elettronica (LoTW, eQSL, Club Log) attestano il collegamento e servono per i **diplomi** (DXCC, WAC, IOTA…).\n\n**Esempio svolto di conversione oraria.** QSO alle 21:15 ora italiana d'estate (UTC+2) → nel log si scrive **19:15 UTC**; d'inverno (UTC+1) sarebbe 20:15 UTC.\n\n### B3.7 Il galateo (good operating practice)\n\n- Ascoltare più che trasmettere.\n- Mai trasmettere sopra un QSO in corso; mai «tarare» l'apparato su una frequenza occupata (usare un carico fittizio).\n- Niente musica, pubblicità, linguaggio offensivo, argomenti di politica e religione da dibattito.\n- Niente comunicazioni cifrate, niente traffico per conto di terzi (salvo emergenza).\n- Rispettare i band plan e i segmenti dei beacon, dei satelliti, dell'emergenza.\n- Non rispondere ai disturbatori: si ignorano e, se necessario, si segnalano.\n\n> **Da ricordare.** Ascolta, chiedi se è libera, chiama; nominativo all'inizio, alla fine e ogni 10 minuti; in pile-up nominativo una volta e ascolto; in split non trasmettere sulla frequenza del DX; log in UTC.\n\n## B4. Soccorso ed emergenza\n\n### B4.1 I segnali di soccorso\n\n| Segnale | Modo | Significato |\n| --- | --- | --- |\n| **SOS** (··· ——— ···) | Telegrafia | Pericolo grave e imminente; si trasmette come un unico segno, senza spazi |\n| **MAYDAY** | Fonia | Pericolo grave e imminente per la vita (dal francese *m'aider*, «aiutatemi»), ripetuto tre volte |\n| **PAN PAN** | Fonia | Urgenza: c'è un problema serio ma non un pericolo immediato |\n| **SÉCURITÉ** | Fonia | Sicurezza: avvisi alla navigazione o meteo |\n\nI segnali di soccorso hanno **priorità assoluta** su qualunque altra comunicazione. Usarli senza motivo è un **reato** (art. 217 del Codice delle comunicazioni: arresto fino a 6 mesi o ammenda) ed è vietato anche dall'Allegato 26.\n\n### B4.2 Se si riceve una richiesta di soccorso\n\n1. **Smettere di trasmettere** qualunque cosa possa disturbare.\n2. **Annotare** frequenza, ora UTC, nominativo o nome della nave o dell'aereo, posizione, natura del pericolo, numero di persone.\n3. **Avvisare subito le autorità** (Autorità di Pubblica Sicurezza: oggi in pratica il **112**; per le navi la Capitaneria di porto, per gli aerei il soccorso aereo).\n4. **Restare in ascolto** sulla frequenza e seguire le indicazioni delle autorità.\n5. Non intralciare: se un'altra stazione meglio attrezzata ha preso in carico il soccorso, collaborare senza sovrapporsi.\n\n### B4.3 Frequenze di soccorso di altri servizi\n\n| Frequenza | Servizio |\n| --- | --- |\n| **156,800 MHz** (canale 16 VHF) | Soccorso e chiamata marittima |\n| **121,500 MHz** | Emergenza aeronautica civile (AM) |\n| **243,000 MHz** | Emergenza aeronautica militare (il doppio di 121,5) |\n| 406 MHz | Radioboe satellitari di soccorso (EPIRB, ELT, PLB) |\n| 2182 kHz | Soccorso marittimo in onde medie (storico) |\n\n### B4.4 I radioamatori in emergenza\n\n- **Risoluzione 640 UIT** (WARC 1979): in caso di catastrofi naturali alcune bande radioamatoriali (centrate su 3,5 – 7 – 10,1 – 14 – 18 – 21 – 24,9 MHz e 144 MHz) possono servire per le comunicazioni internazionali di soccorso; in quel caso sono ammessi il traffico **per conto terzi** e i collegamenti con **stazioni non radioamatoriali**.\n- **Art. 25 RR:** le amministrazioni sono incoraggiate a preparare i radioamatori alle comunicazioni d'emergenza.\n- **Art. 141 del Codice:** in caso di pubblica calamità l'autorità può autorizzare collegamenti speciali **oltre i limiti** ordinari (bande, potenze, modi).\n- **Centri di attività per l'emergenza (band plan IARU Regione 1):** **3760** e **7110 kHz** in LSB, **14300**, **18160** e **21360 kHz** in USB; il traffico si cerca entro circa ±20 kHz.\n- In Italia l'ARI collabora con la Protezione civile attraverso **ARI-RE** (Radiocomunicazioni di Emergenza); la **rete Zamberletti** collega le Prefetture con stazioni gestite da radioamatori.\n\n### B4.5 Come si prepara una stazione d'emergenza\n\n- **Alimentazione autonoma:** batterie cariche, pannello solare o generatore.\n- **Antenne portatili** semplici e collaudate (dipolo filare, verticale).\n- Elenco aggiornato delle frequenze, dei ponti e dei referenti.\n- Moduli per i messaggi (mittente, destinatario, testo, ora) e registro.\n- **Esercitazioni periodiche**: in emergenza si fa solo quello che si è già provato.\n\n**Storia.** Nel 1928 un radioamatore russo captò i messaggi della «tenda rossa» dei superstiti del dirigibile *Italia* di Nobile; nel 1966, durante l'alluvione di Firenze, i radioamatori assicurarono per giorni i collegamenti con l'esterno.\n\n> **Da ricordare.** SOS in CW, MAYDAY in fonia, priorità assoluta; chi riceve un soccorso annota frequenza e ora, avvisa le autorità e resta in ascolto; 156,8 – 121,5 – 243 MHz; emergenza IARU 3760, 7110, 14300, 18160, 21360 kHz.\n\n# Parte C – Regolamentazione nazionale e internazionale\n\n## C1. UIT, Regolamento delle radiocomunicazioni, CEPT e IARU\n\n### C1.1 L'UIT\n\nL'**Unione Internazionale delle Telecomunicazioni** (UIT, in inglese ITU) è l'agenzia delle Nazioni Unite per le telecomunicazioni. Nata a Parigi nel **1865** come Unione telegrafica, ha sede a **Ginevra**. Il settore **ITU-R** gestisce lo spettro radio e le orbite dei satelliti. Le **Conferenze mondiali delle radiocomunicazioni (WRC)**, ogni 3–4 anni, modificano il **Regolamento delle radiocomunicazioni (RR)**, un trattato vincolante per gli Stati.\n\n### C1.2 Gli articoli del RR che interessano il radioamatore\n\n| Riferimento | Contenuto |\n| --- | --- |\n| Art. 1 (n. 1.56 e 1.57) | Definizione del servizio di radioamatore e di radioamatore via satellite |\n| Art. 2 | Nomenclatura delle bande (VLF, LF, MF, HF, VHF, UHF, SHF, EHF) |\n| Art. 5 | Tabella di attribuzione delle frequenze per Regione; servizi primari e secondari |\n| Art. 15 | Interferenze: vietate le emissioni inutili, dannose e senza identificazione |\n| Art. 18 | Nessuna stazione trasmittente senza licenza |\n| Art. 19 | Identificazione delle stazioni e formazione dei nominativi |\n| **Art. 25** | Regole specifiche del servizio di radioamatore |\n| Appendice 1 | Designazione delle emissioni |\n| Appendice 42 | Ripartizione dei prefissi tra gli Stati |\n\n**Definizione (RR 1.56).** Il servizio di radioamatore è un servizio di radiocomunicazione che ha per scopo l'**istruzione individuale**, l'**intercomunicazione** e gli **studi tecnici**, svolto da persone debitamente autorizzate che si interessano alla tecnica radioelettrica a titolo **personale** e **senza interesse economico**.\n\n### C1.3 L'articolo 25 in parole semplici\n\n1. Collegamenti tra Paesi diversi permessi, salvo opposizione di un'amministrazione.\n2. Solo messaggi legati agli scopi del servizio e osservazioni personali.\n3. **Vietato cifrare** il contenuto (eccezione: telecomandi dei satelliti radioamatoriali).\n4. Niente traffico internazionale **per conto di terzi**, salvo emergenza.\n5. Ogni Stato decide se richiedere il **codice Morse** (non più obbligatorio dal 2003) e verifica la competenza dei candidati.\n6. La **potenza massima** la fissa ogni Stato.\n7. Il nominativo va trasmesso **a brevi intervalli**.\n8. Gli Stati incoraggiano la preparazione all'**emergenza**.\n9. Uno Stato può lasciar operare temporaneamente radioamatori stranieri.\n\nLa Sezione II estende tutto al servizio via satellite e impone che le stazioni spaziali possano essere **spente a comando**.\n\n### C1.4 Le Regioni radio\n\n| Regione | Area | Esempi di differenze |\n| --- | --- | --- |\n| **1** | Europa, Africa, Medio Oriente fino al Golfo Persico, ex URSS, Mongolia | 40 m = 7000–7200 kHz; 2 m = 144–146 MHz |\n| 2 | Americhe, Groenlandia | 40 m = 7000–7300 kHz; 2 m = 144–148 MHz |\n| 3 | Resto dell'Asia, Oceania | 2 m = 144–148 MHz |\n\nL'Italia è in **Regione 1**. Vale sempre la tabella della Regione dove si trova la stazione. Per diplomi e contest esistono anche le **zone ITU** (90; Italia 28) e le **zone CQ** (40; Italia 15).\n\n### C1.5 Attribuzione, statuto primario e secondario\n\n- **Attribuzione:** una banda a un **servizio** (fatta dall'UIT e dal piano nazionale). **Assegnazione:** una frequenza a una **stazione**.\n- **Servizio primario** (nel RR in MAIUSCOLO): ha diritto alla protezione.\n- **Servizio secondario:** **non deve disturbare** i primari, **non può pretendere protezione** da loro, ma è protetto dagli altri secondari arrivati dopo.\n\n**Esempio.** Sui 70 cm (430–434 MHz) il radioamatore è secondario: se un radar primario disturba un ponte, il radioamatore non può lamentarsi; se il ponte disturba il radar, deve spegnersi.\n\n### C1.6 La CEPT\n\nLa **CEPT** (Conferenza europea delle amministrazioni delle poste e delle telecomunicazioni, 1959) armonizza l'uso dello spettro in Europa. Due raccomandazioni fondamentali:\n\n| Raccomandazione | Che cosa permette |\n| --- | --- |\n| **T/R 61-01** – Licenza CEPT | Operare **temporaneamente** negli altri Paesi aderenti senza licenza locale |\n| **T/R 61-02** – HAREC | Esame armonizzato: la patente HAREC è riconosciuta per ottenere la licenza **stabile** in un altro Paese |\n| ECC/REC (05)06 | Base per le licenze «novizi» (entry level) |\n\n**All'estero con la licenza CEPT:** si porta l'autorizzazione, si mette davanti al nominativo il **prefisso del Paese ospite** (F/IT9ABC in Francia, 9H/IT9ABC a Malta), si rispettano **bande e potenze del Paese ospite**, per soggiorni temporanei (di norma fino a 3 mesi).\n\n### C1.7 La IARU\n\nLa **IARU** (Parigi, **1925**) è la federazione delle associazioni nazionali, divisa in 3 Regioni come l'UIT. In Italia aderisce l'**ARI**. Partecipa alle WRC come osservatore e redige i **band plan**. Ricorda: UIT, CEPT e Ministero fanno **norme**; IARU e ARI fanno **raccomandazioni**.\n\n> **Da ricordare.** RR art. 25 = regole del servizio; vietato cifrare e trasmettere per terzi; Italia in Regione 1; secondario = non disturba e non è protetto; T/R 61-01 licenza CEPT temporanea, T/R 61-02 HAREC; IARU fondata nel 1925.\n\n## C2. I nominativi\n\n### C2.1 Come è fatto un nominativo\n\nPer il RR (art. 19) un nominativo di radioamatore è formato da un **prefisso** (1–2 caratteri assegnati allo Stato), **una cifra** e un **suffisso** di al massimo 4 caratteri, l'ultimo dei quali è una lettera. L'Appendice 42 assegna all'Italia la serie **IAA–IZZ**. Sono vietati nominativi confondibili con segnali di soccorso e le identificazioni false.\n\n| Prefisso | Paese | Prefisso | Paese |\n| --- | --- | --- | --- |\n| I | Italia | F | Francia |\n| DL (D) | Germania | EA | Spagna |\n| G (M) | Regno Unito | HB9 | Svizzera |\n| OE | Austria | 9H | Malta |\n| SV | Grecia | 9A | Croazia |\n| W, K, N, AA–AL | Stati Uniti | JA | Giappone |\n| T7 | San Marino | HV | Città del Vaticano |\n\n### C2.2 Il nominativo italiano\n\nI + (eventuale seconda lettera) + cifra della **call area** + suffisso, fino a **7 caratteri** in tutto. Il nominativo lo assegna il Ministero, **non si sceglie e non si modifica**; si può però chiedere, se libero, quello di un **coniuge o parente in linea retta deceduto**, e in aggiunta un nominativo a scelta di massimo 5 caratteri (art. 139 c. 2-bis).\n\n| Seconda lettera | Significato |\n| --- | --- |\n| nessuna | Nominativi storici (I2ABC) |\n| K, Z, U | Autorizzazioni ordinarie, assegnate in sequenza: IK, poi IZ, oggi **IU** |\n| W | Ex licenza speciale/classe B (solo VHF e oltre); i nominativi IW restano validi |\n| Q | Sezioni e stazioni di associazioni (es. IQ9DE) |\n| R | Ponti ripetitori (IR + cifra + 3 lettere, assegnate da ZZZ a ritroso) |\n| Y | Stazioni marconiane |\n| I, O, P, B | Nominativi speciali per eventi e contest |\n\n### C2.3 Le call area\n\nLa cifra segue la regione (dal 1972 legata alla prima cifra del CAP).\n\n| Cifra | Regioni |\n| --- | --- |\n| 0 | Lazio, Umbria (I0) · Sardegna (**IS0**) |\n| 1 | Piemonte, Liguria · Valle d'Aosta (**IX1**) |\n| 2 | Lombardia |\n| 3 | Veneto · Trentino-Alto Adige (**IN3**) · Friuli-Venezia Giulia (**IV3**) |\n| 4 | Emilia-Romagna |\n| 5 | Toscana |\n| 6 | Marche, Abruzzo |\n| 7 | Puglia, provincia di Matera |\n| 8 | Campania, Calabria, Molise, provincia di Potenza |\n| 9 | Sicilia (**IT9**) |\n\n**Isole con prefisso proprio:** IA5 isole toscane, IB0 isole laziali, IC8 isole campane (Capri, Ischia), ID9 Eolie, IE9 Ustica, IF9 Egadi, IG9 Pelagie, IH9 Pantelleria, IJ7 e IL7 isole pugliesi (Tremiti = IL7), IM0 isole minori della Sardegna. Come nominativo principale spettano solo ai **residenti**.\n\n### C2.4 Suffissi e operazione fuori sede\n\n| Forma | Significato |\n| --- | --- |\n| **/P** | Stazione portatile |\n| **/M** | Mobile (veicolo) |\n| **/MM** | Marittimo mobile, a bordo di una nave |\n| **/AM** | Aeronautico mobile: **non consentito** in Italia |\n| **/B** | Radiofaro (beacon) |\n| **/cifra** | Da un'altra call area italiana, es. IT9ABC/3 in Veneto (fino a 3 mesi) |\n| **prefisso/** | All'estero con licenza CEPT, es. EA/IT9ABC |\n\nL'esercizio temporaneo fuori residenza in Italia è libero, senza comunicazione (art. 13 dell'Allegato 26). Il **secondo operatore** (un altro patentato) usa il **nominativo della stazione** da cui trasmette, sotto la responsabilità del titolare.\n\n### C2.5 Nominativi per eventi e contest\n\n- **Eventi** (II, IO, IP, IB + cifra + suffisso, anche una parola): si chiedono all'Ispettorato e valgono **solo per la durata dell'evento**.\n- **Contest** (circolare del Ministero, dicembre 2024): massimo **4 caratteri**, I + una lettera tra B, O, I, P + cifra + una lettera (es. IO9A), solo per i contest della lista annuale.\n- **SWL** (solo ascolto): sigla I + numero + sigla della provincia.\n\n> **Da ricordare.** Italia = serie IAA–IZZ; max 7 caratteri; il nominativo non si sceglie; /P portatile, /M mobile, /MM nave, /AM vietato; all'estero prefisso del Paese davanti; isole con prefisso proprio solo per i residenti.\n\n## C3. Bande, potenze e piani IARU\n\n### C3.1 Le bande in Italia (PNRF 2022)\n\nIl **Piano Nazionale di Ripartizione delle Frequenze** (PNRF, D.M. 31 agosto 2022, rivisto periodicamente) dice quali bande sono attribuite al servizio di radioamatore in Italia e con quale statuto (**P** primario, **S** secondario).\n\n| Banda | Frequenze | Statuto | Note |\n| --- | --- | --- | --- |\n| 2200 m | 135,7–137,8 kHz | S | Max 1 W EIRP |\n| 630 m | 472–479 kHz | S | Max 1 W EIRP |\n| 160 m | 1830–1850 kHz | P |  |\n| 80 m | 3500–3800 kHz | S |  |\n| 60 m | 5351,5–5366,5 kHz | S | Max **15 W EIRP**; in fonia USB |\n| 40 m | 7000–7200 kHz | P | Radioamatore e via satellite |\n| 30 m | 10100–10150 kHz | S | WARC; solo CW e digitali |\n| 20 m | 14000–14350 kHz | P |  |\n| 17 m | 18068–18168 kHz | P | WARC |\n| 15 m | 21000–21450 kHz | P |  |\n| 12 m | 24890–24990 kHz | P | WARC |\n| 10 m | 28000–29700 kHz | P |  |\n| 6 m | 50–52 MHz | S |  |\n| 4 m | 70 MHz | — | Non attribuita: solo sperimentazioni temporanee |\n| 2 m | 144–146 MHz | P |  |\n| 70 cm | 430–434 e 435–438 MHz | S / P (435–436) | 434–435 non attribuita |\n| 23 cm | 1240–1245 e 1260–1298 MHz | S |  |\n| 13 cm | 2300–2450 MHz | S |  |\n| 6 cm | 5650–5670, 5760–5770, 5830–5850 MHz | S / P (5760–5770) |  |\n| 3 cm | 10,3–10,5 GHz | S |  |\n| 1,2 cm | 24,00–24,05 GHz | P |  |\n\n**Potenza massima:** **500 W PEP** per stazioni fisse, mobili e portatili, salvo i limiti di banda del PNRF; **ponti e beacon 10 W ERP**.\n\n**Regola d'oro.** Tutta l'emissione, non solo la frequenza indicata, deve stare dentro la banda. **Esempio:** in LSB con 2,7 kHz di banda non si può indicare 7001 kHz: il segnale scenderebbe sotto 7000 kHz.\n\n### C3.2 Le bande WARC e le armoniche\n\nLe bande storiche (160, 80, 40, 20, 15, 10 m) sono quasi in rapporto armonico: per questo un dipolo per i 40 m funziona anche sui 15 m. Nel **1979** la WARC ha aggiunto i **30, 17 e 12 m**, dove per convenzione **non si fanno contest**.\n\n### C3.3 Il band plan IARU (Regione 1)\n\nIl band plan divide ogni banda per modo. **Non è legge**, ma è buona pratica rispettarlo e all'esame si chiede.\n\n- **LSB sotto i 10 MHz, USB sopra** (eccezione: 60 m in USB).\n- **CW** ammesso in tutta la banda tranne nei segmenti dei beacon; la parte bassa di ogni banda è per CW e digitali.\n- **QRP** = potenza fino a 5 W in CW (10 W PEP in SSB).\n- Le frequenze indicate sono quelle effettivamente trasmesse.\n\n| Centro di attività | Frequenze (kHz) |\n| --- | --- |\n| **Emergenza** | 3760, 7110 (Regione 1); 14300, 18160, 21360 |\n| QRP CW | 1836, 3560, 7030, 10116, 14060, 18086, 21060, 24906, 28060 |\n| QRP SSB | 3690, 7090, 14285, 18130, 21285, 24950, 28360 |\n| Immagini (SSTV) | 3735, 7165, 14230, 21340, 28680 |\n| Radiofari IBP (HF) | 14100, 18110, 21150, 24930, 28200 |\n\n### C3.4 Il band plan dei 2 metri\n\n| Segmento (MHz) | Uso |\n| --- | --- |\n| 144,000–144,025 | Satelliti (solo discesa) |\n| 144,025–144,150 | CW, EME; centro CW 144,050 |\n| 144,150–144,400 | CW/SSB; **centro SSB 144,300** |\n| 144,400–144,490 | Beacon |\n| 144,800 | **APRS** |\n| 144,975–145,194 | Ingressi dei ponti FM |\n| 145,500 | **Chiamata FM** |\n| 145,575–145,794 | Uscite dei ponti FM |\n| 145,806–146,000 | Satelliti |\n\n**Esempio.** Ponte con uscita 145,650 MHz → ingresso 145,650 – 0,600 = **145,050 MHz**. In 70 cm un ponte con uscita 430,900 ha ingresso 432,500 (+1,6 MHz).\n\n### C3.5 Il servizio via satellite\n\nUsa stazioni spaziali (satelliti OSCAR, la ISS), stazioni terrene e stazioni di telecomando. **Uplink** = Terra → spazio, **downlink** = spazio → Terra. Si opera solo nei segmenti attribuiti anche al servizio via satellite (es. 145,8–146 MHz e 435–438 MHz). Per l'**effetto Doppler** la frequenza va corretta durante il passaggio.\n\n> **Da ricordare.** 500 W PEP, ponti e beacon 10 W ERP; 60 m 15 W EIRP; 4 m non attribuita; LSB sotto 10 MHz; bande WARC senza contest; 145,500 chiamata FM, 144,300 SSB, 144,800 APRS; ponti 2 m –600 kHz, 70 cm +1,6 MHz.\n\n## C4. Designazione delle emissioni\n\n### C4.1 Struttura\n\nOgni emissione si descrive (RR, Appendice 1) con la **larghezza di banda necessaria** (4 caratteri) seguita da **3 simboli obbligatori** (più 2 facoltativi).\n\n**Esempio guida: 2K70J3E** = 2,7 kHz · J banda laterale unica a portante soppressa · 3 un canale analogico · E telefonia: è la **SSB in fonia**.\n\n### C4.2 La larghezza di banda\n\nTre cifre e una lettera che fa da **virgola** e indica l'unità: **H** hertz, **K** kilohertz, **M** megahertz, **G** gigahertz. Il primo carattere non può essere zero né una lettera.\n\n| Valore | Si scrive |\n| --- | --- |\n| 100 Hz | 100H |\n| 400 Hz | 400H |\n| 2,4 kHz | 2K40 |\n| 2,7 kHz | 2K70 |\n| 12,5 kHz | 12K5 |\n| 16 kHz | 16K0 |\n| 1,25 MHz | 1M25 |\n\n### C4.3 Primo simbolo: modulazione della portante\n\n| Simbolo | Modulazione |\n| --- | --- |\n| N | Portante non modulata |\n| **A** | Ampiezza, doppia banda laterale (AM) |\n| H | Banda laterale unica, portante intera |\n| R | Banda laterale unica, portante ridotta |\n| **J** | Banda laterale unica, **portante soppressa** (SSB) |\n| B | Bande laterali indipendenti |\n| C | Banda laterale residua |\n| **F** | Frequenza |\n| **G** | Fase |\n| D | Ampiezza e angolo insieme |\n| P, K, L, M, Q, V | Impulsi |\n\n### C4.4 Secondo simbolo: segnale modulante\n\n| Simbolo | Segnale |\n| --- | --- |\n| 0 | Nessuno |\n| **1** | Un canale digitale **senza** sottoportante (CW a interruzione della portante) |\n| **2** | Un canale digitale **con** sottoportante (RTTY, PSK, FT8 via audio) |\n| **3** | Un canale **analogico** (voce) |\n| 7 / 8 | Più canali digitali / analogici |\n| 9 | Misto analogico e digitale |\n\n### C4.5 Terzo simbolo: informazione trasmessa\n\n| Simbolo | Informazione |\n| --- | --- |\n| N | Nessuna |\n| **A** | Telegrafia **ad orecchio** (CW) |\n| **B** | Telegrafia **automatica** (RTTY, PSK) |\n| C | Facsimile |\n| **D** | Dati, telemetria, telecomando |\n| **E** | **Telefonia** |\n| F | Televisione |\n| W | Combinazioni |\n\n### C4.6 Le emissioni più comuni\n\n| Designazione | Modo |\n| --- | --- |\n| **100HA1A** | Telegrafia CW |\n| **2K70J3E** | SSB fonia |\n| **6K00A3E** | AM fonia |\n| **16K0F3E** / **11K0F3E** | FM fonia (canali 25 / 12,5 kHz) |\n| **250HF1B** | RTTY in FSK |\n| **60H0J2B** | PSK31 via SSB |\n| **J2D** | Dati via SSB (es. FT8) |\n| **F2D** | Packet radio, APRS in FM |\n| **F3F** | Televisione amatoriale in FM |\n\n**Esempio svolto.** «A3E»: ampiezza a doppia banda laterale (A), un canale analogico (3), telefonia (E) → **AM in fonia**. «F1B»: frequenza (F), digitale senza sottoportante (1), telegrafia automatica (B) → **RTTY a spostamento di frequenza**.\n\n> **Da ricordare.** Banda + modulazione + segnale + informazione; J = SSB a portante soppressa, A = AM, F = FM; 1 digitale, 3 analogico; A orecchio, B automatica, D dati, E fonia.\n\n## C5. La normativa italiana\n\n### C5.1 Le fonti\n\n| Fonte | Che cosa contiene |\n| --- | --- |\n| **Codice delle comunicazioni elettroniche** (D.Lgs. 259/2003, riscritto dal D.Lgs. 207/2021), artt. 134–145 | Attività, patente, autorizzazione, nominativo, emergenza, ponti, stazioni speciali |\n| **Allegato 26** al Codice (D.M. 1° marzo 2021) | Norme tecniche: esami, nominativi, ponti, esercizio, potenze, moduli |\n| **Allegato 25** | Contributi |\n| **PNRF** (D.M. 31 agosto 2022) | Bande, statuti, limiti di potenza |\n| D.P.R. 1214/1966 | Norme storiche (registro, soccorso), ancora citate nei quiz |\n\nL'autorità è il **Ministero delle Imprese e del Made in Italy (MIMIT)**, attraverso gli **Ispettorati territoriali** (in Sicilia l'Ispettorato di Palermo).\n\n### C5.2 Patente e autorizzazione: due cose diverse\n\n| Documento | A cosa serve | Scade? |\n| --- | --- | --- |\n| **Patente** (classe A, HAREC) | Dimostra la competenza; si ottiene con l'esame | **No** |\n| **Autorizzazione generale** | Permette di installare e usare la propria stazione | Sì, **10 anni**, rinnovabile |\n| **Nominativo** | Identifica la stazione | Dura quanto l'autorizzazione |\n\nCon la sola patente si può trasmettere come **secondo operatore** dalla stazione di un altro radioamatore. La **classe N** (novizi, bande e potenze ridotte) è prevista dalla legge ma, al momento in cui si scrive, non ancora rilasciata.\n\n### C5.3 L'esame\n\n- **Parte A** tecnica, **B** regole e procedure, **C** regolamentazione; si supera con il **60%**.\n- **Esonero parziale** dalla parte A per alcuni titoli di studio (lauree e diplomi tecnici in elettronica, telecomunicazioni, informatica) e professionali (GMDSS, radiotelegrafista).\n- Con esonero: **20 domande** sulle parti B e C, superato con **12 esatte** (massimo 8 errori).\n- Domanda sul portale del Ministero con SPID o CIE, all'Ispettorato della regione di residenza; il **codice Morse non è più richiesto**.\n\n### C5.4 I requisiti (art. 137)\n\n- Cittadinanza UE o di Paesi con accordi di reciprocità; residenza in Italia.\n- Età **non inferiore a 14 anni** (per i minorenni serve il consenso di chi esercita la responsabilità genitoriale).\n- Nessuna condanna per delitti non colposi a pena superiore a **2 anni**.\n- Patente.\n\n### C5.5 Dalla patente alla stazione\n\n1. Superato l'esame, si chiede il rilascio della patente (una marca da bollo da 16 €, pagata in modo telematico).\n2. Si chiedono **insieme** nominativo e autorizzazione generale con la **dichiarazione** (art. 138): generalità, sedi della stazione (residenza e fino ad altre 19 sedi), estremi della patente, impegno a rispettare le norme.\n3. Si versa il **contributo annuo di 5 €** entro il **31 gennaio** (Allegato 25).\n4. Il nominativo arriva entro **30 giorni**. L'autorizzazione si rinnova chiedendolo prima della scadenza; se non si rinnova decade e il nominativo resta riservato per **un anno**.\n\n### C5.6 Norme di esercizio (Allegato 26, art. 12)\n\n- Linguaggio chiaro; codici solo se internazionali (codice Q, abbreviazioni); **niente cifratura**.\n- Nominativo all'inizio, alla fine e **ogni 10 minuti**; in ogni pacchetto nei modi digitali.\n- Vietati i falsi segnali di soccorso e l'**intercettazione** di comunicazioni non destinate a sé (e la diffusione del contenuto).\n- Interconnessione con le reti pubbliche solo per emergenza o per gli scopi del servizio.\n- Stazione utilizzabile ovunque e su qualunque mezzo **tranne l'aereo**; documento d'autorizzazione sempre con la stazione.\n- Ascolto libero; potenza **500 W PEP**.\n- **Registro di stazione** obbligatorio, cartaceo o elettronico.\n- Assistenza radio a **gare sportive** con comunicazione preventiva all'Ispettorato (art. 142).\n\n### C5.7 Ponti, beacon e stazioni speciali\n\n- **Ponti ripetitori (art. 143 e Allegato 26 art. 9):** aperti a tutti; portante che si spegne **entro 10 secondi** dall'ultimo segnale; nominativo **ogni 10 minuti**; massimo **10 W ERP**; nominativo IR + cifra + 3 lettere.\n- **Beacon:** basta una **comunicazione**; nominativo del titolare + **/B**; 10 W ERP.\n- **Stazioni speciali (art. 144):** università, scuole (escluse le elementari), associazioni, siti marconiani.\n\n**La regola dei quattro 10:** 10 anni (autorizzazione), 10 minuti (nominativo), 10 secondi (portante dei ponti), 10 W ERP (ponti e beacon).\n\n### C5.8 Controlli e sanzioni\n\n| Violazione | Conseguenza |\n| --- | --- |\n| Stazione senza autorizzazione | Sanzione da 300 a 3000 € |\n| Uso indebito del segnale di soccorso | Reato: arresto fino a 6 mesi o ammenda |\n| Nominativo falso, potenza oltre il limite, registro non tenuto | Sanzione amministrativa |\n| Inosservanza degli obblighi | Diffida, poi **sospensione** fino a 30 giorni, poi **revoca** |\n| Perdita di un requisito | **Decadenza** |\n\nI funzionari del Ministero e gli agenti di polizia possono ispezionare la stazione in ogni momento.\n\n### C5.9 CB e PMR 446\n\nLa banda cittadina (27 MHz) e i PMR 446 sono apparati di **libero uso**: non richiedono patente né contributi, ma non fanno parte del servizio di radioamatore.\n\n> **Da ricordare.** Patente per sempre, autorizzazione 10 anni; da 14 anni; 5 € l'anno entro il 31 gennaio; 500 W PEP; regola dei quattro 10; niente aereo; niente cifratura né intercettazione; registro obbligatorio.\n\n# Appendici\n\n## Appendice 1. Ascoltare prima di trasmettere: gli SDR online\n\nPrima ancora della patente si può ascoltare il traffico radioamatoriale da un ricevitore remoto collegato a Internet, direttamente dal browser.\n\n| Piattaforma | Caratteristiche | Dove trovarle |\n| --- | --- | --- |\n| **WebSDR** | Molti ascoltatori insieme, ciascuno sulla propria frequenza; stabile, ottimo per iniziare | websdr.org (es. il ricevitore dell'Università di Twente, nei Paesi Bassi) |\n| **KiwiSDR** | Pochi utenti per ricevitore (di solito fino a 4), cascata dello spettro, decodifiche integrate (CW, FT8, WSPR) | rx.kiwisdr.com |\n| **OpenWebRX** | Software libero, interfaccia moderna, spesso anche VHF/UHF | elenchi pubblici dei ricevitori |\n\n**Come scegliere:** un ricevitore vicino per ascoltare la propria zona, uno lontano per sentire come arriva il proprio segnale; le bande alte (20–10 m) di giorno, le basse (80–40 m) la sera. Esercizio utile per l'esame: ascoltare un QSO in SSB e annotare nominativi, rapporti RST e codici Q come in un registro.\n\n## Appendice 2. Formulario\n\n| Grandezza | Formula |\n| --- | --- |\n| Legge di Ohm | V = R · I |\n| Potenza | P = V · I = R · I² = V² / R |\n| Lunghezza d'onda | λ \\[m\\] = 300 / f \\[MHz\\] |\n| Dipolo a mezz'onda | L \\[m\\] ≈ 142,5 / f \\[MHz\\] |\n| Decibel di potenza | dB = 10 · log₁₀ (P₂ / P₁) |\n| Decibel di tensione | dB = 20 · log₁₀ (V₂ / V₁) |\n| dBm | 0 dBm = 1 mW; 30 dBm = 1 W |\n| dBi e dBd | dBi = dBd + 2,15; EIRP = ERP × 1,64 |\n| Reattanza induttiva | Xₗ = 2π f L |\n| Reattanza capacitiva | X꜀ = 1 / (2π f C) |\n| Risonanza | f₀ = 1 / (2π √(L C)) |\n| Costante di tempo RC | τ = R · C |\n| Trasformatore | V₁ / V₂ = N₁ / N₂ |\n| Valore efficace | Vₑff = Vₚᵢccₒ / √2 ≈ 0,707 · Vₚᵢccₒ |\n| Banda AM | B = 2 · fₘₐₓ |\n| Banda FM (Carson) | B ≈ 2 · (Δf + fₘₐₓ) |\n| ROS | ROS = Zₘₐ₉ / Zₘᵢₙ; Γ = (ROS – 1)/(ROS + 1); Pᵣ = Γ² · P |\n| Orizzonte radio | d \\[km\\] ≈ 4,12 (√h₁ + √h₂) |\n\n**I dB da sapere a memoria:** 3 dB = × 2; 6 dB = × 4; 10 dB = × 10; 20 dB = × 100; –3 dB = metà. Un punto S = 6 dB.\n\n## Appendice 3. Il manuale in poche righe (ripasso rapido)\n\n- λ = 300/f; dipolo ≈ 142,5/f; 73 Ω; 2,15 dBi.\n- AM = 2 bande laterali; SSB = una, LSB sotto e USB sopra 10 MHz; FM regola di Carson.\n- Strato D assorbe di giorno, F2 fa il DX; FOT ≈ 85% della MUF; ciclo solare di 11 anni.\n- Codice Q: con il ? è domanda; QRK comprensibilità, QSA forza, QTH posizione, QSY cambio frequenza.\n- RST: 59 in fonia, 599 in CW; S9 = 50 µV in HF.\n- Soccorso: SOS e MAYDAY; avvisare le autorità con frequenza e ora; 156,8 – 121,5 – 243 MHz.\n- Emergenza IARU: 3760, 7110, 14300, 18160, 21360 kHz.\n- Italia in Regione 1, serie IAA–IZZ; IT9 Sicilia; /P, /M, /MM, mai /AM.\n- 500 W PEP; ponti e beacon 10 W ERP; 60 m 15 W EIRP.\n- Regola dei quattro 10: anni, minuti, secondi, watt.\n- Patente per sempre, autorizzazione 10 anni, 5 € l'anno entro il 31 gennaio, da 14 anni.\n- CEPT: T/R 61-01 licenza temporanea all'estero, T/R 61-02 HAREC.\n- 2K70J3E = SSB fonia; 16K0F3E = FM; 100HA1A = CW.\n\n## Appendice 4. Fonti e nota sul testo\n\nQuesto manuale è stato scritto in modo originale prendendo come traccia gli argomenti delle pagine «ham-radio» del sito codref.org (salvate offline il 28 ottobre 2026) e integrandoli con il materiale già verificato per la *Dispensa di regolamentazione* (v4): Regolamento delle radiocomunicazioni UIT, raccomandazioni CEPT T/R 61-01 e T/R 61-02, band plan IARU Regione 1, Codice delle comunicazioni elettroniche (artt. 134–145), Allegato 26 (D.M. 1° marzo 2021), PNRF 2022, circolari del Ministero su ponti, beacon e contest, slide e lezioni del corso ARI Catania 2026.\n\nNorme, bande e importi possono cambiare: prima dell'esame e prima di trasmettere verifica sempre i testi in vigore sul sito del Ministero (MIMIT) e dell'ARI. Dove questo manuale e la *Dispensa* differiscono su un punto di regolamentazione, per l'esame vale la *Dispensa*, allineata al corso.\n";
const QA = [{"sec": "A1", "q": "Un amplificatore porta 5 W a 50 W. Quanti dB guadagna?", "opts": ["5 dB", "10 dB", "20 dB", "3 dB"], "ok": 1, "expl": "10·log(50/5) = 10·log 10 = 10 dB."}, {"sec": "A1", "q": "Una perdita di 3 dB significa che la potenza:", "opts": ["si dimezza", "si riduce a un terzo", "si riduce a un decimo", "resta uguale"], "ok": 0, "expl": "−3 dB corrisponde a un rapporto di circa 0,5."}, {"sec": "A1", "q": "Quanto vale 0 dBm?", "opts": ["1 W", "1 mW", "1 µW", "0 W"], "ok": 1, "expl": "Il dBm è riferito a 1 milliwatt: 0 dBm = 1 mW, 30 dBm = 1 W."}, {"sec": "A1", "q": "In HF il livello S9 corrisponde a circa:", "opts": ["5 µV", "50 µV", "500 µV", "5 mV"], "ok": 1, "expl": "S9 = 50 µV su 50 Ω (−73 dBm); ogni punto S vale circa 6 dB."}, {"sec": "A2", "q": "La tensione di rete ha un valore efficace di 230 V. Il valore di picco è circa:", "opts": ["163 V", "230 V", "325 V", "460 V"], "ok": 2, "expl": "Vp = Veff·√2 ≈ 230 × 1,414 ≈ 325 V."}, {"sec": "A2", "q": "La lunghezza d'onda di un segnale a 14 MHz è circa:", "opts": ["2,1 m", "21 m", "42 m", "14 m"], "ok": 1, "expl": "λ = 300/f = 300/14 ≈ 21 m (banda dei 20 metri)."}, {"sec": "A2", "q": "Il periodo di una tensione a 50 Hz è:", "opts": ["50 ms", "20 ms", "2 ms", "0,5 s"], "ok": 1, "expl": "T = 1/f = 1/50 s = 20 ms."}, {"sec": "A3", "q": "Una resistenza da 100 Ω alimentata a 12 V è attraversata da:", "opts": ["1,2 A", "120 mA", "12 mA", "8,3 A"], "ok": 1, "expl": "I = V/R = 12/100 = 0,12 A."}, {"sec": "A3", "q": "Due resistenze da 1 kΩ in parallelo valgono:", "opts": ["2 kΩ", "1 kΩ", "500 Ω", "250 Ω"], "ok": 2, "expl": "Due resistenze uguali in parallelo valgono metà di una sola."}, {"sec": "A3", "q": "Quale potenza dissipa una resistenza da 50 Ω percorsa da 2 A?", "opts": ["100 W", "200 W", "25 W", "400 W"], "ok": 1, "expl": "P = R·I² = 50 × 4 = 200 W."}, {"sec": "A4", "q": "Una corrente che scorre in un filo produce attorno al filo:", "opts": ["un campo elettrico statico", "un campo magnetico", "una carica elettrica", "nessun effetto"], "ok": 1, "expl": "Ogni corrente genera un campo magnetico concentrico al conduttore."}, {"sec": "A4", "q": "L'unità di misura dell'induzione magnetica è:", "opts": ["il weber", "il tesla", "l'henry", "il farad"], "ok": 1, "expl": "L'induzione B si misura in tesla (T); il flusso in weber."}, {"sec": "A5", "q": "Un condensatore da 100 µF caricato attraverso 10 kΩ ha costante di tempo:", "opts": ["0,1 s", "1 s", "10 s", "1 ms"], "ok": 1, "expl": "τ = R·C = 10 000 × 0,0001 = 1 s."}, {"sec": "A5", "q": "Aumentando la frequenza, la reattanza di un condensatore:", "opts": ["aumenta", "diminuisce", "resta uguale", "si annulla sempre"], "ok": 1, "expl": "Xc = 1/(2πfC): cresce f, cala Xc."}, {"sec": "A5", "q": "Due condensatori da 10 nF in parallelo danno:", "opts": ["5 nF", "10 nF", "20 nF", "100 nF"], "ok": 2, "expl": "In parallelo le capacità si sommano (al contrario delle resistenze)."}, {"sec": "A6", "q": "Un trasformatore ha 1000 spire al primario e 100 al secondario. Con 230 V in ingresso esce:", "opts": ["2300 V", "23 V", "230 V", "2,3 V"], "ok": 1, "expl": "V2 = V1·N2/N1 = 230 × 100/1000 = 23 V."}, {"sec": "A6", "q": "La reattanza induttiva:", "opts": ["cresce con la frequenza", "cala con la frequenza", "non dipende dalla frequenza", "è sempre nulla in alternata"], "ok": 0, "expl": "XL = 2πfL: è proporzionale alla frequenza."}, {"sec": "A7", "q": "Alla frequenza di risonanza di un circuito LC:", "opts": ["XL = Xc", "XL = 0", "Xc = 0", "XL = 2·Xc"], "ok": 0, "expl": "La risonanza è il punto in cui le due reattanze sono uguali e si compensano."}, {"sec": "A7", "q": "Un circuito accordato a 7 MHz con Q = 70 ha banda passante:", "opts": ["10 kHz", "100 kHz", "1 MHz", "490 kHz"], "ok": 1, "expl": "B = f0/Q = 7 000 000/70 = 100 kHz."}, {"sec": "A7", "q": "Un filtro passa-basso all'uscita del trasmettitore serve a:", "opts": ["aumentare la potenza", "attenuare le armoniche", "eliminare la portante", "ridurre il ROS"], "ok": 1, "expl": "Le armoniche stanno sopra la frequenza utile: il passa-basso le taglia."}, {"sec": "A8", "q": "La tensione di soglia di un diodo al silicio è circa:", "opts": ["0,2 V", "0,6–0,7 V", "1,8 V", "5,1 V"], "ok": 1, "expl": "Silicio circa 0,6–0,7 V; germanio circa 0,2–0,3 V."}, {"sec": "A8", "q": "Il diodo Zener si usa soprattutto come:", "opts": ["rivelatore AM", "stabilizzatore di tensione", "amplificatore", "oscillatore"], "ok": 1, "expl": "In inversa mantiene ai suoi capi una tensione quasi costante."}, {"sec": "A8", "q": "Un diodo varicap si comporta come:", "opts": ["una resistenza variabile", "una capacità variabile con la tensione", "una bobina", "un interruttore meccanico"], "ok": 1, "expl": "La capacità della giunzione varia con la tensione inversa: si usa per sintonizzare."}, {"sec": "A9", "q": "In un transistor bipolare con β = 100 e Ib = 50 µA, la corrente di collettore è circa:", "opts": ["0,5 mA", "5 mA", "50 mA", "500 µA"], "ok": 1, "expl": "Ic = β·Ib = 100 × 50 µA = 5 mA."}, {"sec": "A9", "q": "Gli elettrodi di un transistor bipolare sono:", "opts": ["gate, drain, source", "base, collettore, emettitore", "anodo, catodo, griglia", "primario e secondario"], "ok": 1, "expl": "Gate, drain e source sono del FET; anodo, catodo e griglia delle valvole."}, {"sec": "A10", "q": "In un triodo l'elettrodo che controlla la corrente è:", "opts": ["il catodo", "la placca", "la griglia", "il filamento"], "ok": 2, "expl": "Una piccola tensione sulla griglia comanda una grande corrente di placca."}, {"sec": "A10", "q": "Perché un amplificatore a valvole va trattato con prudenza anche da spento?", "opts": ["perché resta caldo", "perché i condensatori dell'alta tensione restano carichi", "perché emette raggi X", "non c'è motivo"], "ok": 1, "expl": "Le tensioni di placca arrivano a migliaia di volt e i condensatori conservano la carica."}, {"sec": "A11", "q": "Un raddrizzatore a ponte di Graetz usa:", "opts": ["1 diodo", "2 diodi", "4 diodi", "un diodo Zener"], "ok": 2, "expl": "Quattro diodi sfruttano entrambe le semionde."}, {"sec": "A11", "q": "L'ondulazione residua dopo un raddrizzatore a doppia semionda alimentato a 50 Hz ha frequenza:", "opts": ["25 Hz", "50 Hz", "100 Hz", "200 Hz"], "ok": 2, "expl": "Entrambe le semionde vengono raddrizzate: gli impulsi sono 100 al secondo."}, {"sec": "A11", "q": "Rispetto a un alimentatore lineare, uno switching è:", "opts": ["più pesante e meno efficiente", "più leggero ed efficiente, ma può disturbare in HF", "identico", "adatto solo alle valvole"], "ok": 1, "expl": "Commuta ad alta frequenza: piccolo ed efficiente, ma va filtrato bene."}, {"sec": "A12", "q": "Per amplificare un segnale SSB serve un amplificatore:", "opts": ["in classe C", "lineare (classe A o AB)", "qualsiasi", "solo a valvole"], "ok": 1, "expl": "La classe C distorce l'inviluppo: va bene solo per FM e CW."}, {"sec": "A12", "q": "Un mixer con ingressi a 10 MHz e 15 MHz produce:", "opts": ["10 e 15 MHz", "5 e 25 MHz", "12,5 MHz", "150 MHz"], "ok": 1, "expl": "Il mixer genera la somma (25) e la differenza (5) delle frequenze."}, {"sec": "A12", "q": "Ricevitore FM con FI a 10,7 MHz e oscillatore locale sopra, sintonizzato su 100 MHz: la frequenza immagine è:", "opts": ["89,3 MHz", "110,7 MHz", "121,4 MHz", "10,7 MHz"], "ok": 2, "expl": "Immagine = segnale + 2·FI = 100 + 21,4 = 121,4 MHz."}, {"sec": "A13", "q": "Una porta AND a due ingressi dà 1 quando:", "opts": ["almeno un ingresso è 1", "entrambi gli ingressi sono 1", "gli ingressi sono diversi", "entrambi sono 0"], "ok": 1, "expl": "AND = tutti a 1. Quella che dà 1 con ingressi diversi è la XOR."}, {"sec": "A13", "q": "Il numero binario 1010 vale in decimale:", "opts": ["8", "10", "12", "5"], "ok": 1, "expl": "8 + 0 + 2 + 0 = 10."}, {"sec": "A13", "q": "Per digitalizzare un audio fino a 3 kHz servono almeno:", "opts": ["3000 campioni/s", "6000 campioni/s", "1500 campioni/s", "300 campioni/s"], "ok": 1, "expl": "Teorema del campionamento: almeno il doppio della frequenza massima."}, {"sec": "A14", "q": "Un segnale AM con audio fino a 5 kHz occupa:", "opts": ["5 kHz", "10 kHz", "2,5 kHz", "15 kHz"], "ok": 1, "expl": "B = 2·f massima: due bande laterali da 5 kHz."}, {"sec": "A14", "q": "Sulla banda dei 40 m in fonia SSB si usa per convenzione:", "opts": ["USB", "LSB", "AM", "FM"], "ok": 1, "expl": "LSB sotto i 10 MHz, USB sopra (eccezione: 60 m in USB)."}, {"sec": "A14", "q": "FM con deviazione 5 kHz e audio fino a 3 kHz: la banda di Carson è circa:", "opts": ["8 kHz", "16 kHz", "10 kHz", "30 kHz"], "ok": 1, "expl": "B ≈ 2·(5 + 3) = 16 kHz."}, {"sec": "A14", "q": "Che cosa succede con un indice di modulazione AM superiore al 100%?", "opts": ["più portata senza effetti", "sovramodulazione: distorsione e spurie fuori banda", "la portante sparisce in modo corretto", "il segnale diventa FM"], "ok": 1, "expl": "L'inviluppo si interrompe: nascono distorsioni e splatter sui canali vicini."}, {"sec": "A15", "q": "Un dipolo a mezz'onda per 7,1 MHz è lungo circa:", "opts": ["10 m", "20 m", "42 m", "5 m"], "ok": 1, "expl": "L ≈ 142,5/7,1 ≈ 20 m in totale, due bracci da 10 m."}, {"sec": "A15", "q": "L'impedenza al centro di un dipolo a mezz'onda in spazio libero è circa:", "opts": ["36 Ω", "50 Ω", "73 Ω", "300 Ω"], "ok": 2, "expl": "73 Ω; la ground plane λ/4 ne ha circa 36, il dipolo ripiegato circa 300."}, {"sec": "A15", "q": "Un'antenna da 100 Ω su cavo da 50 Ω dà un ROS di:", "opts": ["1:1", "1,5:1", "2:1", "4:1"], "ok": 2, "expl": "ROS = Zmaggiore/Zminore = 100/50 = 2."}, {"sec": "A15", "q": "10 W in un'antenna da 10 dBd, senza perdite, danno un ERP di:", "opts": ["20 W", "100 W", "1000 W", "16,4 W"], "ok": 1, "expl": "10 dB = × 10: ERP = 100 W."}, {"sec": "A15", "q": "L'accordatore d'antenna:", "opts": ["migliora il rendimento dell'antenna", "fa vedere 50 Ω al trasmettitore ma non elimina le perdite della linea disadattata", "aumenta il guadagno", "elimina le armoniche"], "ok": 1, "expl": "Protegge l'apparato, ma l'antenna resta quella che è."}, {"sec": "A16", "q": "Quale strato ionosferico assorbe le frequenze basse durante il giorno?", "opts": ["D", "E", "F1", "F2"], "ok": 0, "expl": "Lo strato D esiste solo di giorno e assorbe 160, 80 e in parte 40 m."}, {"sec": "A16", "q": "La frequenza ottimale di lavoro (FOT) è circa:", "opts": ["il 50% della MUF", "l'85% della MUF", "il doppio della MUF", "uguale alla LUF"], "ok": 1, "expl": "FOT ≈ 0,85 × MUF."}, {"sec": "A16", "q": "Il ciclo delle macchie solari dura circa:", "opts": ["1 anno", "5 anni", "11 anni", "27 giorni"], "ok": 2, "expl": "Circa 11 anni; 27 giorni è la rotazione del Sole."}, {"sec": "A16", "q": "L'E sporadico favorisce soprattutto aperture improvvise su:", "opts": ["160 m", "10, 6 e 2 m", "80 m", "bande WARC basse"], "ok": 1, "expl": "Nubi molto ionizzate dello strato E, soprattutto d'estate."}, {"sec": "A17", "q": "Un interruttore differenziale «salvavita» domestico interviene tipicamente a:", "opts": ["300 mA", "30 mA", "3 A", "16 A"], "ok": 1, "expl": "30 mA è la soglia di protezione delle persone."}, {"sec": "A17", "q": "Con un temporale in arrivo è buona norma:", "opts": ["trasmettere a bassa potenza", "scollegare le antenne dagli apparati e metterle a terra", "alzare l'antenna", "nessuna precauzione"], "ok": 1, "expl": "Protegge apparati e persone dalle scariche indotte."}, {"sec": "A17", "q": "Il televisore del vicino è disturbato solo quando trasmetti, anche con un trasmettitore pulito. Primo rimedio:", "opts": ["aumentare la potenza", "filtro passa-alto e ferriti sull'ingresso del televisore", "cambiare antenna TV", "nessuno, è colpa sua"], "ok": 1, "expl": "È un sovraccarico del ricevitore TV: si filtra il suo ingresso."}, {"sec": "B", "q": "Come si scandisce la lettera J con l'alfabeto ICAO?", "opts": ["Jack", "Juliett", "Japan", "Jolly"], "ok": 1, "expl": "Juliett, con due t."}, {"sec": "B", "q": "QRK indica:", "opts": ["la forza del segnale", "la comprensibilità del segnale", "la frequenza esatta", "la posizione"], "ok": 1, "expl": "La forza è QSA; QRG la frequenza; QTH la posizione."}, {"sec": "B", "q": "In CW un rapporto RST tipico è:", "opts": ["59", "599", "5/9", "S9"], "ok": 1, "expl": "In CW tre cifre (con il tono), in fonia due."}, {"sec": "B", "q": "Una stazione DX dice «up 5». Cosa devi fare?", "opts": ["chiamare sulla sua frequenza", "trasmettere 5 kHz più in alto e ascoltare la sua frequenza", "alzare la potenza di 5 dB", "aspettare 5 minuti"], "ok": 1, "expl": "Lavora in split: si imposta il ricetrasmettitore per trasmettere 5 kHz sopra."}];
const QE = [{"q": "Il servizio di radioamatore è definito:", "opts": ["dal Codice delle comunicazioni", "dal Regolamento delle Radiocomunicazioni UIT", "dalla IARU", "dalla CEPT"], "ok": 1, "expl": "La definizione è nel RR (n. 1.56). Il Codice italiano la riprende, la IARU è un'associazione e la CEPT armonizza a livello europeo.", "sec": "A. UIT, RR e definizioni"}, {"q": "Quale elemento NON fa parte della definizione del servizio di radioamatore?", "opts": ["Istruzione individuale", "Intercomunicazione", "Studio tecnico", "Servizio di pubblica utilità a pagamento"], "ok": 3, "expl": "Il servizio è svolto *senza interesse pecuniario*; qualunque scopo di lucro è escluso.", "sec": "A. UIT, RR e definizioni"}, {"q": "Il servizio di radioamatore via satellite utilizza:", "opts": ["solo stazioni terrene", "stazioni spaziali su satelliti della Terra per gli stessi scopi del servizio di radioamatore", "satelliti commerciali a noleggio", "solo la banda dei 10 GHz"], "ok": 1, "expl": "È la definizione RR 1.57: stessi scopi, ma con stazioni spaziali.", "sec": "A. UIT, RR e definizioni"}, {"q": "Chi modifica il Regolamento delle Radiocomunicazioni?", "opts": ["Il MIMIT", "La IARU", "Le Conferenze mondiali delle radiocomunicazioni (WRC)", "La CEPT"], "ok": 2, "expl": "Le WRC dell'UIT, ogni 3–4 anni, sono l'unica sede in cui il trattato viene rivisto.", "sec": "A. UIT, RR e definizioni"}, {"q": "In quale articolo del RR si trovano le norme specifiche dei servizi di radioamatore?", "opts": ["Art. 1", "Art. 5", "Art. 19", "Art. 25"], "ok": 3, "expl": "L'art. 1 contiene le definizioni, l'art. 5 le attribuzioni, l'art. 19 l'identificazione.", "sec": "A. UIT, RR e definizioni"}, {"q": "L'Italia appartiene alla:", "opts": ["Regione 1", "Regione 2", "Regione 3", "Regione 1 per le HF e 2 per le VHF"], "ok": 0, "expl": "Le Regioni sono geografiche e valgono per tutte le frequenze.", "sec": "B. Regioni, attribuzioni, statuti"}, {"q": "In Regione 1 la banda dei 2 metri è:", "opts": ["144–148 MHz", "144–146 MHz", "142–146 MHz", "145–148 MHz"], "ok": 1, "expl": "144–148 MHz vale per le Regioni 2 e 3.", "sec": "B. Regioni, attribuzioni, statuti"}, {"q": "Nella tabella di attribuzione del RR un servizio scritto in MAIUSCOLO è:", "opts": ["secondario", "primario", "esclusivo", "sperimentale"], "ok": 1, "expl": "Primario in maiuscolo, secondario in carattere normale. «Esclusivo» significa che la banda ha un solo servizio, informazione diversa dallo statuto.", "sec": "B. Regioni, attribuzioni, statuti"}, {"q": "Una stazione di un servizio secondario:", "opts": ["può chiedere protezione dai servizi primari", "non deve causare interferenze dannose ai servizi primari e non può chiederne protezione", "ha gli stessi diritti del primario", "può operare solo di notte"], "ok": 1, "expl": "È la regola RR 5.28–5.30. Il secondario può però chiedere protezione da altri secondari autorizzati in seguito.", "sec": "B. Regioni, attribuzioni, statuti"}, {"q": "Il servizio di radioamatore nella banda 430–434 MHz in Italia è:", "opts": ["primario esclusivo", "primario condiviso", "secondario", "non attribuito"], "ok": 2, "expl": "Deve accettare le interferenze dei servizi primari (es. radiolocalizzazione) senza causarne.", "sec": "B. Regioni, attribuzioni, statuti"}, {"q": "La differenza tra attribuzione e assegnazione è:", "opts": ["nessuna", "l'attribuzione riguarda una banda a un servizio, l'assegnazione una frequenza a una stazione", "il contrario", "l'attribuzione è nazionale, l'assegnazione internazionale"], "ok": 1, "expl": "L'attribuzione è nella tabella UIT; l'assegnazione la fa l'amministrazione nazionale.", "sec": "B. Regioni, attribuzioni, statuti"}, {"q": "Un'interferenza che degrada gravemente o interrompe ripetutamente un servizio che opera secondo il RR è detta:", "opts": ["ammissibile", "accettata", "dannosa", "spuria"], "ok": 2, "expl": "«Spuria» è un tipo di emissione indesiderata, non una categoria di interferenza.", "sec": "B. Regioni, attribuzioni, statuti"}, {"q": "La raccomandazione CEPT T/R 61-01 riguarda:", "opts": ["il certificato d'esame armonizzato", "la licenza CEPT per operare temporaneamente nei Paesi aderenti", "le potenze massime", "i band plan"], "ok": 1, "expl": "L'HAREC è la T/R 61-02.", "sec": "C. CEPT e attività all'estero"}, {"q": "Un radioamatore italiano, IT9ABC, opera in portatile in Germania (prefisso DL) con licenza CEPT. Il nominativo corretto è:", "opts": ["IT9ABC/DL", "DL/IT9ABC/P", "IT9ABC/P", "DL9ABC"], "ok": 1, "expl": "Il prefisso del Paese ospite va **davanti** al nominativo, il suffisso /P **dopo**.", "sec": "C. CEPT e attività all'estero"}, {"q": "Operando all'estero con licenza CEPT si devono rispettare:", "opts": ["bande e potenze italiane", "bande e potenze del Paese ospitante", "le più favorevoli tra le due", "solo i band plan IARU"], "ok": 1, "expl": "La licenza CEPT consente di operare, ma nelle condizioni del Paese in cui ci si trova.", "sec": "C. CEPT e attività all'estero"}, {"q": "I band plan IARU sono:", "opts": ["obbligatori per legge", "raccomandazioni volontarie", "parte del RR", "emanati dal MIMIT"], "ok": 1, "expl": "Sono buona pratica operativa, non norme.", "sec": "C. CEPT e attività all'estero"}, {"q": "La norma tecnica italiana che disciplina l'attività radioamatoriale è:", "opts": ["l'Allegato 26 al Codice delle comunicazioni elettroniche", "l'Appendice 42 del RR", "la T/R 61-01", "il band plan ARI"], "ok": 0, "expl": "Sostituito dal D.M. 1° marzo 2021, contiene esami, nominativi, potenze e norme di esercizio.", "sec": "D. Normativa italiana"}, {"q": "La potenza massima di una stazione di radioamatore in Italia è:", "opts": ["100 W", "300 W", "500 W PEP, fatte salve le limitazioni del PNRF", "1 kW"], "ok": 2, "expl": "In alcune bande (es. 60 m, 2200 m, 630 m) il PNRF impone limiti molto più bassi.", "sec": "D. Normativa italiana"}, {"q": "L'autorizzazione generale ha durata:", "opts": ["5 anni", "10 anni", "illimitata", "1 anno"], "ok": 1, "expl": "È rinnovabile }

function slider(box, o, cb){

/* --- piano cartesiano --- */
function niceTicks(a, b, n=6){

function ctls(el){ const k = h('div', {class:'ctls'}); el.append(k); return k; }

lab('decibel', 'A1.3', 'Calcolatore dei decibel', 'Rapporto di potenza o di tensione e il suo valore in dB.', el => {
  const k = ctls(el); let u;
  const p1 = slider(k, {label:'Potenza in ingresso P₁', min:0.01, max:1000, value:10, log:true, fmt:v => si(v,'W')}, () => u());
  const p2 = slider(k, {label:'Potenza in uscita P₂', min:0.01, max:1000, value:100, log:true, fmt:v => si(v,'W')}, () => u());
  const pl = plot(el, {x:[0.01, 1000], y:[-40, 60], xlog:true, xlabel:'rapporto P₂/P₁ (o V₂/V₁)', ylabel:'dB', xfmt:v => nf(v,2)});
  const ro = readout(el);
  u = () => { const r = p2.get()/p1.get(), db = 10*Math.log10(r);
    pl.draw([{f:x => 10*Math.log10(x), color:'--c1', label:'potenza: 10·log'}, {f:x => 20*Math.log10(x), color:'--c2', label:'tensione: 20·log', dash:[5,4]}, {dots:[[r, db]], color:'--c3'}], {labels:[{x:r, y:db, t:nf(db,1)+' dB', color:'--c3'}]});
    ro([['Rapporto P₂/P₁', '× ' + nf(r, 3)], ['Guadagno', nf(db, 2) + ' dB', 'hi'], ['Se fosse un rapporto di tensioni', nf(20*Math.log10(r), 2) + ' dB'], ['In dBm (P₂)', nf(10*Math.log10(p2.get()*1000), 1) + ' dBm']]); };
  u();
});

lab('smeter', 'A1.5', 'S-meter', 'Punti S, dBm e microvolt su 50 Ω (HF: S9 = 50 µV, 6 dB per punto).', el => {
  const k = ctls(el); let run;
  const steps = ['S1','S2','S3','S4','S5','S6','S7','S8','S9','S9+10','S9+20','S9+30','S9+40','S9+50','S9+60'];
  const s = slider(k, {label:'Lettura', min:0, max:14, step:1, value:8, fmt:v => steps[v]}, () => run());
  const ro = readout(el);
  const dbm = i => i <= 8 ? -73 - 6*(8 - i) : -73 + 10*(i - 8);
  run = canvas(el, W => Math.min(220, W*0.45), (c, W, H) => {
    const i = s.get(), d = dbm(i), cx = W/2, cy = H - 14, R = Math.min(W*0.45, H - 30);
    const ang = v => Math.PI*(1.15 - 0.3*0 ) - (v/14)*Math.PI*0.7 - Math.PI*0.15; // da sinistra a destra
    c.lineWidth = 6; c.strokeStyle = tok('--c1'); c.beginPath(); c.arc(cx, cy, R, Math.PI*1.15, Math.PI*(1.15+0.7*8/14)); c.stroke();
    c.strokeStyle = tok('--bad'); c.beginPath(); c.arc(cx, cy, R, Math.PI*(1.15+0.7*8/14), Math.PI*1.85); c.stroke();
    c.font = '11px ' + tok('--f-mono'); c.fillStyle = tok('--fg'); c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 1.5; c.strokeStyle = tok('--mute');
    for (let j = 0; j <= 14; j++){ const a = Math.PI*1.15 + Math.PI*0.7*j/14; c.beginPath(); c.moveTo(cx + (R-8)*Math.cos(a), cy + (R-8)*Math.sin(a)); c.lineTo(cx + (R+6)*Math.cos(a), cy + (R+6)*Math.sin(a)); c.stroke();
      const lb = ['1','','3','','5','','7','','9','','+20','','+40','','+60'][j]; if (lb) c.fillText(lb, cx + (R+18)*Math.cos(a), cy + (R+18)*Math.sin(a)); }
    const a = Math.PI*1.15 + Math.PI*0.7*i/14; c.strokeStyle = tok('--c3'); c.lineWidth = 3; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + (R-14)*Math.cos(a), cy + (R-14)*Math.sin(a)); c.stroke(); c.fillStyle = tok('--c3'); c.beginPath(); c.arc(cx, cy, 6, 0, 7); c.fill();
    const uv = Math.sqrt(Math.pow(10, d/10)/1000*50)*1e6;
    ro([['Livello', d + ' dBm', 'hi'], ['Tensione in antenna (50 Ω)', si(uv*1e-6, 'V')], ['Rispetto a S9', (d+73 >= 0 ? '+' : '') + (d+73) + ' dB']]);
  });
});

lab('sinusoide', 'A2.3', 'La tensione alternata', 'Ampiezza, frequenza e fase di una sinusoide; valore efficace.', el => {
  const k = ctls(el); let u;
  const vp = slider(k, {label:'Tensione di picco Vp', min:1, max:400, value:325, step:1, unit:'V', dec:0}, () => u());
  const f = slider(k, {label:'Frequenza', min:25, max:500, value:50, step:1, unit:'Hz', dec:0}, () => u());
  const ph = slider(k, {label:'Fase', min:0, max:360, value:0, step:5, unit:'°', dec:0}, () => u());
  const pl = plot(el, {x:[0, 40], y:[-420, 420], xlabel:'tempo (ms)', ylabel:'V'});
  const ro = readout(el);
  u = () => { const V = vp.get(), F = f.get(), p = ph.get()*Math.PI/180, ve = V/Math.SQRT2;
    pl.draw([{f:t => V*Math.sin(TAU*F*t/1000 + p), color:'--c1', label:'v(t)'}, {hline:ve, color:'--c2', dash:[5,4], w:1.5, label:'+Veff'}, {hline:-ve, color:'--c2', dash:[5,4], w:1.5}]);
    ro([['Periodo T = 1/f', nf(1000/F, 2) + ' ms'], ['Valore efficace Veff = Vp/√2', nf(ve, 1) + ' V', 'hi'], ['Picco-picco', nf(2*V, 0) + ' V'], ['Pulsazione ω = 2πf', nf(TAU*F, 1) + ' rad/s']]); };
  u();
});

lab('sfasamento', 'A2.3', 'Sfasamento tra tensione e corrente', 'Su resistenza, induttanza e condensatore; potenza istantanea.', el => {
  const k = ctls(el); let u;
  const t = select(k, 'Carico', [['R','Resistenza (0°)'],['L','Induttanza ideale (−90°)'],['C','Condensatore ideale (+90°)'],['RL','R e L in serie (regolabile)']], () => u());
  const a = slider(k, {label:'Angolo (solo R+L)', min:0, max:90, value:40, step:1, unit:'°', dec:0}, () => u());
  const pl = plot(el, {x:[0, 720], y:[-1.2, 1.2], xlabel:'angolo (°)', xfmt:v => nf(v,0)});
  const ro = readout(el);
  u = () => { const ty = t.get(); const phi = ty==='R' ? 0 : ty==='L' ? -90 : ty==='C' ? 90 : -a.get(); const r = phi*Math.PI/180;
    const v = x => Math.sin(x*Math.PI/180), i = x => 0.8*Math.sin(x*Math.PI/180 + r);
    pl.draw([{f:v, color:'--c1', label:'tensione'}, {f:i, color:'--c2', label:'corrente'}, {f:x => v(x)*i(x), color:'--c3', w:1.2, dash:[3,3], label:'potenza istantanea', fill:true}]);
    ro([['Sfasamento φ', (phi>0?'+':'') + phi + '°' + (phi<0 ? ' (corrente in ritardo)' : phi>0 ? ' (corrente in anticipo)' : ''), 'hi'], ['Fattore di potenza cos φ', nf(Math.cos(r), 3)], ['Potenza attiva media', phi === 0 ? 'massima' : Math.abs(phi) === 90 ? 'nulla: l\'energia va e torna' : nf(Math.cos(r)*100,0) + '% di quella con carico resistivo']]); };
  u();
});

lab('trifase', 'A2.3', 'Corrente trifase', 'Tre sinusoidi sfasate di 120°: la loro somma è sempre zero.', el => {
  const pl = plot(el, {x:[0, 720], y:[-1.3, 1.3], xlabel:'angolo (°)', xfmt:v => nf(v,0)});
  const s = o => x => Math.sin((x - o)*Math.PI/180);
  pl.draw([{f:s(0), color:'--c1', label:'L1'}, {f:s(120), color:'--c2', label:'L2'}, {f:s(240), color:'--c3', label:'L3'}, {f:x => s(0)(x)+s(120)(x)+s(240)(x), color:'--mute', dash:[4,4], label:'somma'}]);
});

lab('armoniche', 'A2.3', 'Armoniche e onda quadra', 'Un\'onda quadra è la somma della fondamentale e delle armoniche dispari (serie di Fourier).', el => {
  const k = ctls(el); let u;
  const n = slider(k, {label:'Armonica più alta sommata', min:1, max:49, value:5, step:2, dec:0, fmt:v => v + 'ª'}, () => u());
  const pl = plot(el, {x:[0, 720], y:[-1.5, 1.5], xlabel:'angolo (°)', xfmt:v => nf(v,0)});
  const ro = readout(el);
  u = () => { const N = n.get(); const sq = x => { let s = 0; for (let m = 1; m <= N; m += 2) s += Math.sin(m*x*Math.PI/180)/m; return 4/Math.PI*s; };
    pl.draw([{f:x => Math.sign(Math.sin(x*Math.PI/180)), color:'--mute', dash:[4,4], w:1.2, label:'onda quadra ideale'}, {f:x => 4/Math.PI*Math.sin(x*Math.PI/180), color:'--c2', w:1.2, label:'fondamentale'}, {f:sq, color:'--c1', label:'somma fino alla ' + N + 'ª'}]);
    ro([['Armoniche sommate', String((N+1)/2)], ['Frequenze presenti (fondamentale 7 MHz)', Array.from({length:Math.min(5,(N+1)/2)}, (_, j) => nf(7*(2*j+1),0)).join(', ') + (N > 9 ? '… MHz' : ' MHz')], ['Perché conta in radio', 'un trasmettitore che distorce genera armoniche: servono filtri passa-basso']]); };
  u();
});

lab('lunghezza-onda', 'A2.4', 'Frequenza e lunghezza d\'onda', 'λ = 300/f; in quale banda UIT e radioamatoriale cade la frequenza.', el => {
  const k = ctls(el); let run;
  const f = slider(k, {label:'Frequenza', min:0.1, max:3000, value:7.1, log:true, round:3, fmt:v => si(v*1e6,'Hz')}, () => run());
  const ro = readout(el);
  const ITU = [['VLF',3e-3,3e-2],['LF',3e-2,0.3],['MF',0.3,3],['HF',3,30],['VHF',30,300],['UHF',300,3000],['SHF',3000,30000]];
  run = canvas(el, 92, (c, W, H) => {
    const F = f.get(), lo = Math.log10(0.1), hi = Math.log10(3000), X = v => 10 + (Math.log10(v)-lo)/(hi-lo)*(W-20);
    c.font = '11px ' + tok('--f-mono'); c.textAlign = 'center'; c.textBaseline = 'middle';
    ITU.forEach(([n, a, b], i) => { const x0 = Math.max(10, X(a)), x1 = Math.min(W-10, X(b)); if (x1 <= x0) return; c.fillStyle = tok(i%2 ? '--band2' : '--band1'); c.fillRect(x0, 14, x1-x0, 26); c.fillStyle = tok('--fg'); c.fillText(n, (x0+x1)/2, 27); });
    c.fillStyle = tok('--c2'); for (const b of HAM_BANDS){ const x0 = X(b.a/1000), x1 = X(b.b/1000); c.fillRect(x0, 46, Math.max(2, x1-x0), 10); }
    c.fillStyle = tok('--mute'); c.textAlign = 'left'; c.fillText('bande radioamatoriali', 10, 70);
    const x = X(F); c.strokeStyle = tok('--c3'); c.lineWidth = 2; c.beginPath(); c.moveTo(x, 8); c.lineTo(x, 60); c.stroke();
    const lam = 300/F, band = HAM_BANDS.find(b => F*1000 >= b.a && F*1000 <= b.b), itu = ITU.find(([, a, b]) => F >= a && F < b);
    ro([['Lunghezza d\'onda λ', lam >= 1 ? nf(lam, 2) + ' m' : nf(lam*100, 1) + ' cm', 'hi'], ['λ/2 (dipolo teorico)', nf(lam/2, 2) + ' m'], ['λ/4 (stilo teorico)', nf(lam/4, 2) + ' m'], ['Banda UIT', itu ? itu[0] : '—'], ['Banda radioamatoriale', band ? band.n + ' (' + band.s + ')' : 'nessuna in Italia']]);
  });
});

lab('ohm', 'A3.1', 'Legge di Ohm: caratteristica I–V', 'Tre resistenze a confronto: più è grande R, meno pende la retta.', el => {
  const k = ctls(el); let u;
  const r = [100, 220, 470].map((v, i) => slider(k, {label:'R' + (i+1), min:10, max:1000, value:v, step:10, unit:'Ω', dec:0}, () => u()));
  const vv = slider(k, {label:'Tensione applicata', min:0, max:24, value:12, step:0.5, unit:'V', dec:1}, () => u());
  const pl = plot(el, {x:[0, 24], y:[0, 250], xlabel:'tensione (V)', ylabel:'mA'});
  const ro = readout(el);
  u = () => { const V = vv.get(); const cols = ['--c1','--c2','--c3'];
    pl.draw([...r.map((s, i) => ({f:x => x/s.get()*1000, color:cols[i], label:'R' + (i+1) + ' = ' + s.get() + ' Ω'})), {vline:V, color:'--mute', dash:[4,4], w:1}]);
    ro(r.map((s, i) => ['I con R' + (i+1) + ' a ' + nf(V,1) + ' V', nf(V/s.get()*1000, 1) + ' mA · P = ' + si(V*V/s.get(), 'W')])); };
  u();
});

lab('potenza', 'A3.2', 'Potenza dissipata', 'P = V²/R a tensione fissa, P = R·I² a corrente fissa.', el => {
  const k = ctls(el); let u;
  const m = select(k, 'Cosa tengo fisso', [['V','la tensione'],['I','la corrente']], () => u());
  const vv = slider(k, {label:'Tensione', min:1, max:50, value:12, step:1, unit:'V', dec:0}, () => u());
  const ii = slider(k, {label:'Corrente', min:0.1, max:5, value:1, step:0.1, unit:'A', dec:1}, () => u());
  const rr = slider(k, {label:'Resistenza scelta', min:1, max:100, value:10, step:1, unit:'Ω', dec:0}, () => u());
  const pl = plot(el, {x:[1, 100], y:[0, 150], xlabel:'R (Ω)', ylabel:'W'});
  const ro = readout(el);
  u = () => { const V = vv.get(), I = ii.get(), R = rr.get(); const fv = m.get() === 'V';
    const f = fv ? x => V*V/x : x => I*I*x; const ymax = Math.max(5, Math.min(2500, fv ? V*V/1 : I*I*100) * 1.05);
    pl.draw([{f, color:'--c1', label: fv ? 'P = V²/R' : 'P = R·I²', fill:true}, {dots:[[R, f(R)]], color:'--c3'}], {y:[0, ymax], labels:[{x:R, y:f(R), t:nf(f(R),1)+' W', color:'--c3'}]});
    ro([['Potenza con R = ' + R + ' Ω', nf(f(R), 2) + ' W', 'hi'], [fv ? 'Corrente' : 'Tensione', fv ? nf(V/R, 2) + ' A' : nf(I*R, 1) + ' V'], ['Resistore da scegliere', 'almeno ' + nf(Math.ceil(f(R)*2*10)/10, 1) + ' W (margine ×2)']]); };
  u();
});

lab('serie-parallelo', 'A3.4', 'Resistenze in serie e in parallelo', 'Calcolo immediato per tre resistenze.', el => {
  const k = ctls(el); let u;
  const r = [1000, 1000, 2200].map((v, i) => numIn(k, 'R' + (i+1), v, 'Ω', () => u()));
  const ro = readout(el);
  u = () => { const v = r.map(x => x.get()).filter(x => x > 0); if (!v.length) return ro([['', 'inserisci almeno un valore']]);
    const s = v.reduce((a, b) => a + b, 0), p = 1/v.reduce((a, b) => a + 1/b, 0);
    ro([['Serie: R₁ + R₂ + R₃', si(s, 'Ω'), 'hi'], ['Parallelo: 1/(1/R₁ + 1/R₂ + 1/R₃)', si(p, 'Ω'), 'hi'], ['Controllo', 'il parallelo è sempre minore della resistenza più piccola']]); };
  u();
});

lab('codice-colori', 'A3.6', 'Codice colori dei resistori', 'Scegli le fasce e leggi il valore.', el => {
  const COL = [['nero','#1b1b1b'],['marrone','#7b3f12'],['rosso','#c81e1e'],['arancio','#ef7d00'],['giallo','#f1c40f'],['verde','#1f9d55'],['blu','#1f5fbf'],['viola','#7d3cb5'],['grigio','#8a8a8a'],['bianco','#f4f4f4']];
  const MUL = [...COL.map((c, i) => [c[0], c[1], Math.pow(10, i)]), ['oro','#c9a227',0.1], ['argento','#b9bec4',0.01]];
  const TOL = [['marrone','#7b3f12','±1%'],['rosso','#c81e1e','±2%'],['oro','#c9a227','±5%'],['argento','#b9bec4','±10%']];
  const k = ctls(el); let u;
  const b1 = select(k, '1ª fascia', COL.map((c, i) => [i, c[0] + ' (' + i + ')']), () => u(), 4);
  const b2 = select(k, '2ª fascia', COL.map((c, i) => [i, c[0] + ' (' + i + ')']), () => u(), 7);
  const b3 = select(k, 'Moltiplicatore', MUL.map((c, i) => [i, c[0] + ' (×' + nf(c[2], 2) + ')']), () => u(), 2);
  const b4 = select(k, 'Tolleranza', TOL.map((c, i) => [i, c[0] + ' (' + c[2] + ')']), () => u(), 2);
  const fig = h('div', {class:'scroll svgfig'}); el.append(fig); const ro = readout(el);
  u = () => { const a = +b1.get(), b = +b2.get(), m = MUL[+b3.get()], t = TOL[+b4.get()]; const val = (a*10 + b)*m[2];
    const band = (x, col) => `<rect x="${x}" y="20" width="14" height="60" fill="${col}" stroke="#0003"/>`;
    fig.innerHTML = `<svg viewBox="0 0 360 100" width="360" height="100" role="img" aria-label="resistore"><line x1="0" y1="50" x2="360" y2="50" stroke="var(--mute)" stroke-width="4"/><rect x="70" y="20" width="220" height="60" rx="26" fill="#d9c3a0" stroke="#0004"/>${band(100, COL[a][1])}${band(130, COL[b][1])}${band(160, m[1])}${band(250, t[1])}</svg>`;
    ro([['Valore', si(val, 'Ω'), 'hi'], ['Tolleranza', t[2] + ' → da ' + si(val*(1 - parseFloat(t[2].slice(1))/100), 'Ω') + ' a ' + si(val*(1 + parseFloat(t[2].slice(1))/100), 'Ω')], ['Lettura', (a*10+b) + ' × ' + nf(m[2], 2)]]); };
  u();
});

lab('campo-filo', 'A4.1', 'Campo magnetico attorno a un filo', 'B = μ₀·I / (2π·r): cala con la distanza.', el => {
  const k = ctls(el); let u;
  const I = slider(k, {label:'Corrente nel filo', min:1, max:100, value:10, step:1, unit:'A', dec:0}, () => u());

    ro([['A 10 mm', nf(B(10), 0) + ' µT', 'hi'], ['A 100 mm', nf(B(100), 1) + ' µT'], ['Distanza a cui eguaglia il campo terrestre', nf(200*i/50, 0) + ' mm']]); };

lab('carica-rc', 'A5.3', 'Carica e scarica di un condensatore', 'Costante di tempo τ = R·C; dopo 5τ il condensatore è praticamente carico.', el => {
  const k = ctls(el); let u;
  const m = select(k, 'Fase', [['c','Carica'],['s','Scarica']], () => u());
  const R = slider(k, {label:'Resistenza', min:1, max:100, value:10, step:1, unit:'kΩ', dec:0}, () => u());
  const C = slider(k, {label:'Capacità', min:1, max:100, value:47, step:1, unit:'µF', dec:0}, () => u());
  const V = slider(k, {label:'Tensione di alimentazione', min:1, max:24, value:12, step:0.5, unit:'V', dec:1}, () => u());
  const pl = plot(el, {x:[0, 1], y:[0, 25], xlabel:'tempo (ms)', ylabel:'V sul condensatore'});
  const ro = readout(el);
  u = () => { const tau = R.get()*C.get(), E = V.get(), ch = m.get() === 'c'; const f = t => ch ? E*(1 - Math.exp(-t/tau)) : E*Math.exp(-t/tau);
    const marks = [1,2,3,4,5].map(n => ({vline:n*tau, color:'--grid', w:1}));
    pl.draw([...marks, {f, color:'--c1', label: ch ? 'carica' : 'scarica', fill:true}, {hline:E, color:'--mute', dash:[5,4], w:1}, {dots:[[tau, f(tau)], [5*tau, f(5*tau)]], color:'--c3'}], {x:[0, 6*tau], y:[0, E*1.1], labels:[{x:tau, y:f(tau), t:'τ: ' + nf(f(tau)/E*100,0) + '%', color:'--c3'}, {x:5*tau, y:f(5*tau), t:'5τ', color:'--c3', align:'right', dx:-6}]});
    ro([['Costante di tempo τ = R·C', nf(tau, 1) + ' ms', 'hi'], ['Dopo τ', nf(f(tau), 2) + ' V (' + (ch ? '63%' : '37%') + ')'], ['Dopo 5τ = ' + nf(5*tau, 0) + ' ms', nf(f(5*tau), 2) + ' V (' + (ch ? '99%' : '1%') + ')']]); };
  u();
});

lab('reattanza-c', 'A5.5', 'Reattanza capacitiva', 'Xc = 1/(2π·f·C): alle frequenze alte il condensatore "passa".', el => {
  const k = ctls(el); let u;
  const C = slider(k, {label:'Capacità', min:1, max:1e6, value:100, log:true, round:3, fmt:v => si(v*1e-12, 'F')}, () => u());
  const F = slider(k, {label:'Frequenza di prova', min:1e3, max:1e8, value:7.1e6, log:true, round:3, fmt:v => si(v, 'Hz')}, () => u());
  const pl = plot(el, {x:[1e3, 1e8], y:[0.01, 1e7], xlog:true, ylog:true, xlabel:'frequenza (Hz)', ylabel:'Ω', xfmt:v => si(v,'').trim(), yfmt:v => si(v,'').trim()});
  const ro = readout(el);
  u = () => { const c = C.get()*1e-12, f = F.get(), xc = x => 1/(TAU*x*c);
    pl.draw([{f:xc, color:'--c1', label:'Xc'}, {dots:[[f, xc(f)]], color:'--c3'}], {labels:[{x:f, y:xc(f), t:si(xc(f),'Ω'), color:'--c3'}]});
    ro([['Xc a ' + si(f, 'Hz'), si(xc(f), 'Ω'), 'hi'], ['Raddoppiando la frequenza', 'Xc si dimezza'], ['A 50 Hz (rete)', si(xc(50), 'Ω')]]); };
  u();
});

lab('reattanza-l', 'A6.2', 'Reattanza induttiva', 'XL = 2π·f·L: alle frequenze alte la bobina "blocca".', el => {
  const k = ctls(el); let u;
  const L = slider(k, {label:'Induttanza', min:0.01, max:10000, value:10, log:true, round:3, fmt:v => si(v*1e-6, 'H')}, () => u());

lab('smorzata', 'A7.1', 'Oscillazione smorzata del circuito LC', 'L\'energia passa tra L e C; la resistenza la dissipa.', el => {

lab('transistor', 'A9.2', 'Caratteristiche d\'uscita del transistor', 'Ic in funzione di Vce per varie correnti di base, con la retta di carico.', el => {
  const k = ctls(el); let u;
  const beta = slider(k, {label:'Guadagno β (hFE)', min:50, max:300, value:150, step:5, dec:0}, () => u());
  const vcc = slider(k, {label:'Vcc', min:5, max:20, value:12, step:0.5, unit:'V', dec:1}, () => u());
  const rc = slider(k, {label:'Resistenza di collettore Rc', min:0.5, max:5, value:1.5, step:0.1, unit:'kΩ', dec:1}, () => u());
  const ib = slider(k, {label:'Corrente di base Ib', min:0, max:60, value:30, step:1, unit:'µA', dec:0}, () => u());
  const pl = plot(el, {x:[0, 20], y:[0, 20], xlabel:'Vce (V)', ylabel:'Ic (mA)'});
  const ro = readout(el);
  u = () => { const b = beta.get(), V = vcc.get(), R = rc.get(), Ib = ib.get();
    const Ic = (ibuA, v) => b*ibuA*1e-3*(1 + v/80)*(1 - Math.exp(-v/0.15));
    const curves = [10,20,30,40,50,60].map(x => ({f:v => Ic(x, v), color:'--mute', w:1}));
    let vq = V; for (let i = 0; i < 60; i++){ const ic = Ic(Ib, vq); vq = Math.max(0.05, V - ic*R) * 0.5 + vq*0.5; } const icq = (V - vq)/R;
    pl.draw([...curves, {f:v => Ic(Ib, v), color:'--c1', label:'Ib = ' + Ib + ' µA'}, {f:v => (V - v)/R, color:'--c2', label:'retta di carico', dash:[6,4]}, {dots:[[vq, icq]], color:'--c3'}], {y:[0, Math.max(10, V/R*1.1)], labels:[{x:vq, y:icq, t:'Q', color:'--c3'}]});
    const reg = vq < 0.3 ? 'saturazione (interruttore chiuso)' : Ib === 0 ? 'interdizione (interruttore aperto)' : 'zona attiva (amplificatore)';
    ro([['Punto di lavoro', 'Ic = ' + nf(icq, 2) + ' mA, Vce = ' + nf(vq, 2) + ' V', 'hi'], ['Regione', reg], ['Ic = β·Ib (ideale)', nf(b*Ib/1000, 2) + ' mA']]); };
  u();
});
